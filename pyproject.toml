[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spore-host"
version = "0.1.5"
description = "Python SDK for spore.host — ephemeral EC2 compute for researchers"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Scott Friedman", email = "scttfrdmn@gmail.com" },
]
keywords = ["aws", "ec2", "compute", "research", "hpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "boto3>=1.34",
    "requests>=2.31",
]

[project.optional-dependencies]
jupyter = ["ipywidgets>=8.0", "IPython>=8.0"]
# ruff is capped below 0.16: that release moved a large set of opinionated rules
# (UP045, UP037, UP006, BLE, TRY, C408, B017, …) into the DEFAULT rule set, so an
# unpinned `ruff check .` changes what it enforces whenever ruff publishes — here
# it took the count from 3 real findings to 76, the rest being annotation-style
# suggestions. Same cap as the workflow adapters (airflow-spawn, cwl-spawn,
# miniwdl-spawn, snakemake-executor-plugin-spawn). Raising it is a deliberate
# change: pick the rules to adopt via an explicit `[tool.ruff.lint] select`.
# PyYAML is here for tests/test_ci_hygiene.py, which parses .github/dependabot.yml.
# It is a test dependency only — the SDK itself must not grow a YAML dependency.
# It is declared rather than guarded with a skip: a test that skips when an import
# is missing reports green while asserting nothing, which is the exact failure mode
# those tests exist to catch.
dev     = ["pytest>=7", "pytest-asyncio", "black", "ruff>=0.5,<0.16", "pyyaml>=6"]

[project.urls]
Homepage      = "https://spore.host"
Documentation = "https://docs.spore.host"
Repository    = "https://github.com/spore-host/spore-host"
Issues        = "https://github.com/spore-host/spore-host/issues"

[tool.hatch.build.targets.wheel]
packages = ["spore"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Notebook cells legitimately import mid-document (each cell is its own top
# level), so E402 "import not at top of cell" is noise for an example notebook.
"examples/*.ipynb" = ["E402"]
