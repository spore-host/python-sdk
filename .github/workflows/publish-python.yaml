name: Publish Python SDK

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI
        # Pinned to a commit SHA, not `@release/v1`. That was a BRANCH ref, so it
        # resolved to whatever the tip of that branch was at the moment this job
        # ran — and this job holds `id-token: write` in the `pypi` environment,
        # i.e. authority to publish spore-host to PyPI as us. Nothing in this repo
        # sat between an upstream force-push and code executing with that token.
        # Dependabot bumps this pin (see .github/dependabot.yml) so it stays
        # current without being mutable. (#10)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
