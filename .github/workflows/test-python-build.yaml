name: Test Python SDK Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build twine
      - name: Build
        run: python -m build
      - name: Validate
        run: twine check dist/*
      - name: Test install
        run: pip install dist/*.whl && python -c "import spore; print('spore-host', spore.__version__)"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest tests/ -v --tb=short

  lint:
    # `ruff` was a declared dev dependency that CI never invoked, so it enforced
    # nothing. Run it on one version (lint results don't vary across the matrix).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .

      # Same rationale as the ruff step above: pin results don't vary across the
      # matrix, so this lives here rather than in the 4-way `test` job — one
      # `git ls-remote` per action, not four. This is the half of pin hygiene that
      # needs the network, so it can't live in the (hermetic) pytest suite: does
      # each pin's `# vX.Y.Z` actually name the tag its SHA carries? A wrong label
      # is worse than none — it makes a major-version jump read as a routine
      # same-line bump, which is how a checkout v6 -> v7.0.1 bump nearly landed in
      # nf-spawn labelled `# v6`. Read-only, no auth.
      - name: Verify pin comments match their SHAs
        run: ./scripts/verify-pins.sh
