# Dependabot configuration for python-sdk.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Why this file exists: every action here is now pinned to a commit SHA (#10),
# which closes the mutable-tag hole but opens a staleness one — a SHA never moves,
# including past a security fix, and unlike `@v5` nothing updates it. Pinning is
# only safe when something bumps the pins. That something is this file.
#
# This matters most for publish-python.yaml, which holds `id-token: write` in the
# `pypi` environment: whatever runs there can publish to PyPI as us.

version: 2
updates:
  # GitHub Actions. Dependabot understands SHA pins: it rewrites both the SHA and
  # the trailing `# vX.Y.Z` comment, so the pins stay readable and reviewable.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    # Don't propose a release the day it ships; let it sit a week first. A fresh
    # tag is exactly when a compromised or broken one is still unnoticed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    # No `reviewers:` key on purpose — it's deprecated and inert. Every one of the
    # umbrella repo's Dependabot PRs asks for a reviewer and none has ever had a
    # review request. Use CODEOWNERS if you want one.
    groups:
      # One PR for all of them. The pattern is "*", not "actions/*", because the
      # publish action is pypa/gh-action-pypi-publish — the single most important
      # one to keep current, and the one "actions/*" would silently exclude.
      github-actions:
        patterns:
          - "*"

  # Python dependencies from pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # ruff 0.16 moved a set of opinionated rules into the DEFAULT rule set, so
      # a bump reddens lint with no code change. The pin is deliberate; lift the
      # ceiling and this ignore together, after triaging the new rules.
      - dependency-name: "ruff"
        versions: [">=0.16"]
